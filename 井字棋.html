<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>井字棋 · 小游戏</title>
<style>
  :root {
    --accent: #2055b8; --accent2: #648cc7;
    --bg: linear-gradient(140deg, #edf1f8 0%, #e8edf6 45%, #e4eaf4 100%);
    --text: #333d52; --muted: #6a7698;
    --panel: #ffffff; --border: #e3e8f0; --cell: #eaf0f8;
  }
  body.dark {
    --bg: linear-gradient(140deg, #121826 0%, #141b2c 45%, #161e30 100%);
    --text: #e7eaf0; --muted: #9aa6bd;
    --panel: #1b2334; --border: #29324a; --cell: #26304a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 16px; transition: background .3s, color .3s; }
  #themeBtn { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; }
  .wrap { width: 100%; max-width: 340px; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .btn { border: none; cursor: pointer; font-size: 13px; padding: 8px 12px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .btn.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .mode { margin-left: auto; display: flex; gap: 6px; }
  .status { text-align: center; font-size: 16px; margin: 0 0 10px; min-height: 24px; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cell { aspect-ratio: 1; border: 1px solid var(--border); background: var(--cell); border-radius: 12px;
    font-size: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .1s, background .15s; }
  .cell:hover { transform: translateY(-2px); }
  .cell.win { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .score { display: flex; gap: 8px; margin-top: 12px; }
  .score .box { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; text-align: center; padding: 6px 8px; }
  .score .box span { display: block; font-size: 11px; color: var(--muted); }
  .score .box b { font-size: 17px; }
  .overlay { position: fixed; inset: 0; background: rgba(15,22,34,.55); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; z-index: 10; }
  .overlay.show { opacity: 1; visibility: visible; }
  .overlay-box { background: var(--panel); color: var(--text); border-radius: 14px; padding: 24px 30px; text-align: center; }
  .overlay-box h2 { margin: 0 0 14px; }
</style>
</head>
<body>
<button id="themeBtn" title="切换深色 / 浅色">🌙</button>
<div class="wrap">
  <header>
    <h1>井字棋</h1>
    <div class="mode">
      <button class="btn ghost" id="pvpBtn">双人</button>
      <button class="btn ghost" id="aiBtn">人机</button>
    </div>
    <button class="btn" id="reset">重来</button>
  </header>
  <p class="status" id="status">轮到 ❌</p>
  <div class="board" id="board"></div>
  <div class="score">
    <div class="box"><span>❌</span><b id="xScore">0</b></div>
    <div class="box"><span>平局</span><b id="drawScore">0</b></div>
    <div class="box"><span>⭕</span><b id="oScore">0</b></div>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlayTitle"></h2>
    <button class="btn" id="again">再来一局</button>
  </div>
</div>
<script>
  const X = '❌', O = '⭕';
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const xScoreEl = document.getElementById('xScore');
  const oScoreEl = document.getElementById('oScore');
  const drawScoreEl = document.getElementById('drawScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const pvpBtn = document.getElementById('pvpBtn');
  const aiBtn = document.getElementById('aiBtn');

  let board = [], turn = X, over = false, mode = 'pvp';
  let score = { X: 0, O: 0, draw: 0 };
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function build() {
    board = Array(9).fill(null); turn = X; over = false;
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      c.addEventListener('click', () => onCell(i));
      boardEl.appendChild(c);
    }
    statusEl.textContent = '轮到 ' + turn;
    overlay.classList.remove('show');
  }

  function onCell(i) {
    if (over || board[i]) return;
    if (mode === 'ai' && turn === O) return;
    place(i, turn);
    if (!over) {
      turn = turn === X ? O : X;
      statusEl.textContent = '轮到 ' + turn;
      if (mode === 'ai' && turn === O) setTimeout(aiTurn, 450);
    }
  }

  function place(i, mark) {
    board[i] = mark;
    boardEl.children[i].textContent = mark;
    const line = checkWin(mark);
    if (line) {
      line.forEach(idx => boardEl.children[idx].classList.add('win'));
      over = true; score[mark]++;
      updateScore();
      statusEl.textContent = mark + ' 赢了！';
      overlayTitle.textContent = (mode === 'ai')
        ? (mark === X ? '🎉 你赢了！' : '😵 电脑赢了')
        : mark + ' 赢了！';
      setTimeout(() => overlay.classList.add('show'), 400);
    } else if (board.every(v => v)) {
      over = true; score.draw++;
      updateScore();
      statusEl.textContent = '平局';
      overlayTitle.textContent = '🤝 平局';
      setTimeout(() => overlay.classList.add('show'), 400);
    }
  }

  function checkWin(mark) {
    for (const line of LINES) if (line.every(i => board[i] === mark)) return line;
    return null;
  }

  function wouldWin(mark) {
    for (let i = 0; i < 9; i++) if (!board[i]) {
      board[i] = mark;
      const w = checkWin(mark);
      board[i] = null;
      if (w) return i;
    }
    return -1;
  }

  function aiTurn() {
    if (over) return;
    let i = wouldWin(O);
    if (i < 0) i = wouldWin(X);
    if (i < 0 && !board[4]) i = 4;
    if (i < 0) {
      const corners = [0,2,6,8].filter(k => !board[k]);
      if (corners.length) i = corners[Math.floor(Math.random() * corners.length)];
    }
    if (i < 0) {
      const empty = board.map((v, k) => v ? null : k).filter(v => v !== null);
      if (empty.length) i = empty[Math.floor(Math.random() * empty.length)];
    }
    place(i, O);
    if (!over) { turn = X; statusEl.textContent = '轮到 ' + turn; }
  }

  function updateScore() {
    xScoreEl.textContent = score.X;
    oScoreEl.textContent = score.O;
    drawScoreEl.textContent = score.draw;
  }

  function setMode(m) {
    mode = m;
    pvpBtn.classList.toggle('active', m === 'pvp');
    aiBtn.classList.toggle('active', m === 'ai');
    build();
  }

  document.getElementById('reset').addEventListener('click', build);
  document.getElementById('again').addEventListener('click', build);
  pvpBtn.addEventListener('click', () => setMode('pvp'));
  aiBtn.addEventListener('click', () => setMode('ai'));

  const themeBtn = document.getElementById('themeBtn');
  try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark'); } catch (e) {}
  function sync() { themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙'; }
  sync();
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    try { localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
    sync();
  });

  setMode('pvp');
</script>
</body>
</html>
