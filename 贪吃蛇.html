<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>贪吃蛇 · 小游戏</title>
<style>
  :root {
    --accent: #2055b8; --accent2: #648cc7;
    --bg: linear-gradient(140deg, #edf1f8 0%, #e8edf6 45%, #e4eaf4 100%);
    --text: #333d52; --muted: #6a7698;
    --panel: #ffffff; --border: #e3e8f0; --cell: #eaf0f8;
  }
  body.dark {
    --bg: linear-gradient(140deg, #121826 0%, #141b2c 45%, #161e30 100%);
    --text: #e7eaf0; --muted: #9aa6bd;
    --panel: #1b2334; --border: #29324a; --cell: #26304a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 16px; transition: background .3s, color .3s; }
  #themeBtn { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; z-index: 10; }
  .wrap { width: 100%; max-width: 420px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header h1 { margin: 0; font-size: 24px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .stats { display: flex; gap: 8px; margin-left: auto; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 5px 12px; text-align: center; min-width: 64px; }
  .box span { display: block; font-size: 11px; color: var(--muted); }
  .box b { font-size: 18px; }
  .stage { position: relative; }
  canvas { display: block; width: 100%; border-radius: 14px; border: 1px solid var(--border); background: var(--panel); box-shadow: 0 8px 24px rgba(30,60,120,.14); touch-action: none; }
  .overlay { position: absolute; inset: 0; border-radius: 14px; background: rgba(15,22,34,.55); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
  .overlay.show { opacity: 1; visibility: visible; }
  .overlay-box { text-align: center; color: #fff; }
  .overlay-box h2 { margin: 0 0 8px; font-size: 26px; }
  .overlay-box p { margin: 0 0 16px; font-size: 14px; opacity: .85; }
  .btn { border: none; cursor: pointer; font-size: 14px; padding: 9px 18px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 0; }
</style>
</head>
<body>
<button id="themeBtn" title="切换深色 / 浅色">🌙</button>
<div class="wrap">
  <header>
    <h1>贪吃蛇</h1>
    <div class="stats">
      <div class="box"><span>得分</span><b id="score">0</b></div>
      <div class="box"><span>最高</span><b id="best">0</b></div>
    </div>
  </header>
  <div class="stage">
    <canvas id="cv" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-box">
        <h2>😵 撞了</h2>
        <p id="overText"></p>
        <button class="btn" id="again">再来一局</button>
      </div>
    </div>
  </div>
  <p class="hint">方向键 / WASD / 滑动 控制方向</p>
</div>
<script>
  const N = 20, CELL = 20;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay'), overText = document.getElementById('overText');
  let snake, dir, nextDir, food, score, best, running, timer;
  try { best = +localStorage.getItem('bestSnake') || 0; } catch (e) {}
  bestEl.textContent = best;

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--panel');
    ctx.fillRect(0, 0, 400, 400);
    // 网格
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--border');
    ctx.lineWidth = 0.5;
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 400); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(400, i * CELL); ctx.stroke();
    }
    // 食物
    ctx.fillStyle = '#e05a5a';
    ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2); ctx.fill();
    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? getComputedStyle(document.body).getPropertyValue('--accent') : getComputedStyle(document.body).getPropertyValue('--accent2');
      const px = s.x * CELL + 1, py = s.y * CELL + 1, sz = CELL - 2;
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(px, py, sz, sz, 5); ctx.fill(); }
      else ctx.fillRect(px, py, sz, sz);
    });
  }

  function gameOver() {
    running = false;
    clearTimeout(timer);
    if (score > best) { best = score; try { localStorage.setItem('bestSnake', best); } catch (e) {} }
    bestEl.textContent = best;
    overText.textContent = '得分 ' + score + ' · 最高 ' + best;
    overlay.classList.add('show');
  }

  function tick() {
    if (!running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score++; scoreEl.textContent = score; placeFood(); }
    else snake.pop();
    draw();
    timer = setTimeout(tick, Math.max(70, 150 - score * 3));
  }

  function setDir(d) {
    if ((dir.x === -d.x && dir.y === -d.y) || (dir.x === d.x && dir.y === d.y)) return;
    nextDir = d;
  }

  function start() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir; score = 0; running = true;
    scoreEl.textContent = '0'; overlay.classList.remove('show');
    placeFood(); draw();
    timer = setTimeout(tick, 150);
  }

  document.addEventListener('keydown', e => {
    const m = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0], W: [0,-1], S: [0,1], A: [-1,0], D: [1,0] };
    if (m[e.key]) { e.preventDefault(); setDir({ x: m[e.key][0], y: m[e.key][1] }); }
  });

  let tx = 0, ty = 0;
  cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir({ x: dx > 0 ? 1 : -1, y: 0 });
    else setDir({ x: 0, y: dy > 0 ? 1 : -1 });
  }, { passive: true });

  document.getElementById('again').addEventListener('click', start);

  const themeBtn = document.getElementById('themeBtn');
  try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark'); } catch (e) {}
  function sync() { themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙'; }
  sync();
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    try { localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
    sync(); draw();
  });

  start();
</script>
</body>
</html>
