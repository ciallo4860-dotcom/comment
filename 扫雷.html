<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>扫雷 · 小游戏</title>
<style>
  :root {
    --accent: #2055b8; --accent2: #648cc7;
    --bg: linear-gradient(140deg, #edf1f8 0%, #e8edf6 45%, #e4eaf4 100%);
    --text: #333d52; --muted: #6a7698;
    --panel: #ffffff; --border: #e3e8f0;
    --cell: #eaf0f8; --cell-open: #ffffff;
  }
  body.dark {
    --bg: linear-gradient(140deg, #121826 0%, #141b2c 45%, #161e30 100%);
    --text: #e7eaf0; --muted: #9aa6bd;
    --panel: #1b2334; --border: #29324a;
    --cell: #26304a; --cell-open: #1b2334;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 16px; transition: background .3s, color .3s; }
  #themeBtn { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; }
  .wrap { width: 100%; max-width: 380px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .stats { display: flex; gap: 8px; margin-left: auto; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 5px 12px; text-align: center; min-width: 60px; }
  .box span { display: block; font-size: 11px; color: var(--muted); }
  .box b { font-size: 18px; }
  .btn { border: none; cursor: pointer; font-size: 13px; padding: 8px 12px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .btn.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
  .toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .board { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; background: var(--border); padding: 3px; border-radius: 10px; }
  .cell {
    aspect-ratio: 1; border: none; border-radius: 4px; font-size: var(--fs, 15px); font-weight: bold;
    background: var(--cell); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 0; line-height: 1;
  }
  .cell.open { background: var(--cell-open); cursor: default; }
  .cell.mine { background: #e26b6b; }
  .n1 { color: #2f6fd0; } .n2 { color: #2e9e5b; } .n3 { color: #d4573f; } .n4 { color: #7b52c7; }
  .n5 { color: #b04a7a; } .n6 { color: #2aa0a0; } .n7 { color: #3a4a68; } .n8 { color: #6a7698; }
  .overlay { position: fixed; inset: 0; background: rgba(15,22,34,.55); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; z-index: 10; }
  .overlay.show { opacity: 1; visibility: visible; }
  .overlay-box { background: var(--panel); color: var(--text); border-radius: 14px; padding: 26px 30px; text-align: center; }
  .overlay-box h2 { margin: 0 0 8px; }
  .overlay-box p { margin: 0 0 16px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<button id="themeBtn" title="切换深色 / 浅色">🌙</button>
<div class="wrap" id="wrap">
  <header>
    <h1>扫雷</h1>
    <div class="stats">
      <div class="box"><span>💣</span><b id="mines">10</b></div>
      <div class="box"><span>用时</span><b id="time">0s</b></div>
    </div>
    <button class="btn" id="reset">重来</button>
  </header>
  <div class="toolbar">
    <button class="btn ghost" id="modeBtn">⛏️ 挖开</button>
    <span class="spacer"></span>
    <button class="btn ghost" id="diffEasy">简单</button>
    <button class="btn ghost" id="diffNormal">中级</button>
    <button class="btn ghost" id="diffHard">困难</button>
  </div>
  <div class="board" id="board"></div>
  <p class="hint">左键挖开 · 右键插旗 · 把雷都标出来</p>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlayTitle"></h2>
    <p id="result"></p>
    <button class="btn" id="again">再来一局</button>
  </div>
</div>
<script>
  const DIFF = {
    easy:   { rows: 9,  cols: 9,  mines: 10, label: '简单' },
    normal: { rows: 12, cols: 12, mines: 25, label: '中级' },
    hard:   { rows: 16, cols: 16, mines: 40, label: '困难' }
  };
  const board = document.getElementById('board');
  const wrap = document.getElementById('wrap');
  const minesEl = document.getElementById('mines');
  const timeEl = document.getElementById('time');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const resultEl = document.getElementById('result');
  const modeBtn = document.getElementById('modeBtn');
  const diffBtns = { easy: document.getElementById('diffEasy'), normal: document.getElementById('diffNormal'), hard: document.getElementById('diffHard') };

  let ROWS = 9, COLS = 9, MINES = 10, diff = 'easy';
  let cells = [], els = [], flags = 0, seconds = 0, timer = null, over = false, flagMode = false;

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function build() {
    clearInterval(timer); timer = null; over = false; flags = 0; seconds = 0;
    timeEl.textContent = '0s'; minesEl.textContent = MINES;
    overlay.classList.remove('show');
    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + COLS + ', 1fr)';
    board.style.setProperty('--fs', COLS >= 16 ? '11px' : COLS >= 12 ? '13px' : '15px');
    cells = []; els = [];
    const idx = shuffle([...Array(ROWS * COLS).keys()]).slice(0, MINES);
    const mineSet = new Set(idx);
    for (let r = 0; r < ROWS; r++) {
      cells[r] = [];
      for (let c = 0; c < COLS; c++) cells[r][c] = { mine: mineSet.has(r * COLS + c), adj: 0, revealed: false, flagged: false };
    }
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (cells[r][c].mine) continue;
      let n = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && cells[rr][cc].mine) n++;
      }
      cells[r][c].adj = n;
    }
    for (let r = 0; r < ROWS; r++) {
      els[r] = [];
      for (let c = 0; c < COLS; c++) {
        const b = document.createElement('button');
        b.className = 'cell';
        b.addEventListener('click', () => onCell(r, c));
        b.addEventListener('contextmenu', e => { e.preventDefault(); onFlag(r, c); });
        board.appendChild(b);
        els[r][c] = b;
      }
    }
  }

  function startTimer() { if (!timer) timer = setInterval(() => { seconds++; timeEl.textContent = seconds + 's'; }, 1000); }

  function onCell(r, c) {
    if (over) return;
    if (flagMode) { onFlag(r, c); return; }
    const cell = cells[r][c];
    if (cell.flagged || cell.revealed) return;
    startTimer();
    reveal(r, c);
  }

  function onFlag(r, c) {
    if (over) return;
    const cell = cells[r][c];
    if (cell.revealed) return;
    cell.flagged = !cell.flagged;
    els[r][c].textContent = cell.flagged ? '🚩' : '';
    flags += cell.flagged ? 1 : -1;
    minesEl.textContent = MINES - flags;
  }

  function reveal(r, c) {
    const cell = cells[r][c];
    if (cell.revealed || cell.flagged) return;
    cell.revealed = true;
    const el = els[r][c];
    el.classList.add('open');
    if (cell.mine) { el.textContent = '💣'; el.classList.add('mine'); lose(); return; }
    if (cell.adj > 0) { el.textContent = cell.adj; el.classList.add('n' + cell.adj); }
    else {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) reveal(rr, cc);
      }
    }
    if (checkWin()) win();
  }

  function checkWin() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      if (!cells[r][c].mine && !cells[r][c].revealed) return false;
    return true;
  }

  function lose() {
    over = true; clearInterval(timer);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      if (cells[r][c].mine) els[r][c].textContent = '💣';
    overlayTitle.textContent = '💥 踩雷了！';
    resultEl.textContent = '再来一局试试';
    overlay.classList.add('show');
  }

  function win() {
    over = true; clearInterval(timer);
    overlayTitle.textContent = '🎉 扫雷成功！';
    resultEl.textContent = '用时 ' + seconds + ' 秒';
    overlay.classList.add('show');
  }

  function setDifficulty(key) {
    diff = key;
    ROWS = DIFF[key].rows; COLS = DIFF[key].cols; MINES = DIFF[key].mines;
    wrap.style.maxWidth = COLS >= 16 ? '520px' : COLS >= 12 ? '440px' : '380px';
    Object.keys(diffBtns).forEach(k => diffBtns[k].classList.toggle('active', k === key));
    build();
  }

  document.getElementById('reset').addEventListener('click', build);
  document.getElementById('again').addEventListener('click', build);
  modeBtn.addEventListener('click', () => {
    flagMode = !flagMode;
    modeBtn.textContent = flagMode ? '🚩 插旗' : '⛏️ 挖开';
  });
  diffBtns.easy.addEventListener('click', () => setDifficulty('easy'));
  diffBtns.normal.addEventListener('click', () => setDifficulty('normal'));
  diffBtns.hard.addEventListener('click', () => setDifficulty('hard'));

  const themeBtn = document.getElementById('themeBtn');
  try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark'); } catch (e) {}
  function sync() { themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙'; }
  sync();
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    try { localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
    sync();
  });

  setDifficulty('easy');
</script>
</body>
</html>
